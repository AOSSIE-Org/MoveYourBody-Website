# Enables IDE autocompletion for this config file
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Language for CodeRabbit's review comments
language: en

# Enable experimental features
early_access: true

chat:
  # CodeRabbit will automatically respond to @coderabbitai mentions in PR comments
  auto_reply: true

reviews:
  profile: assertive # Options: chill, assertive

  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
    drafts: false
    base_branches:
      - main
      - develop

  high_level_summary: true
  sequence_diagrams: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  request_changes_workflow: false

  pre_merge_checks:
    description:
      mode: warning
    docstrings:
      mode: off

  path_filters:
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/out/**"
    - "!**/.git/**"

  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    languagetool:
      enabled: true
      enabled_only: false
      level: default
    biome:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    eslint:
      enabled: true

  labeling_instructions:
    - label: Typescript Lang
      instructions: Apply when the PR contains changes to TypeScript or JavaScript files
    - label: UI/UX & Styles
      instructions: Apply when the PR contains changes to CSS, Tailwind classes, or React components
    - label: i18n
      instructions: Apply when the PR contains changes to translation catalogs or internationalization setup
    - label: Tests
      instructions: Apply when the PR adds or modifies test suites
    - label: Documentation
      instructions: Apply whenever project documentation (markdown files) is updated
    - label: CI/CD
      instructions: Apply when GitHub workflows are updated

  instructions: >-
    - Verify that documentation and comments are free of spelling mistakes
    - Ensure that test code is automated, comprehensive, and follows testing best practices
    - Verify that all critical functionality is covered by tests
    - Confirm that the code meets the project's requirements and objectives
    - Confirm that copyright years are up-to-date whenever a file is changed
    - Point out redundant comments that do not add clarity to the code
    - Look for code duplication
    - Suggest fixes when seeing TODO or FIXME comments

  path_instructions:
    # TypeScript & React files
    - path: "src/**/*.{ts,tsx,js,jsx}"
      instructions: |
        Next.js App Router (v16):
        - Follow React Server Components (RSC) by default. Use "use client" only when client state, interactivity, or browser-only hooks are strictly required.
        - Layout and page params are Promises: always `await params` before accessing properties.
        - Never import Link, useRouter, or usePathname from 'next/link' or 'next/navigation'. Always import from '@/i18n/navigation'.
        - Do not hardcode external links; import them from '@/config/links'.

        Styling & Themes:
        - Tailwind CSS v4 semantic tokens must be used (e.g. `bg-background-primary`, `text-foreground-primary`, `text-highlight`, `border-border-subtle`).
        - Do NOT use inline dark classes (e.g. `dark:bg-black`, `dark:text-white`) or hard-coded hex colors.
        - Typography must use standard `--font-sans` with Lexend / Noto Sans Devanagari. Letter-spacing must not be applied to Hindi text.

        Motion & Performance:
        - Animate only transform and opacity.
        - Gate animations behind `motion-safe:` or reduced-motion checks.
        - Off-screen work must be paused with `useInView` / IntersectionObserver.
        - Do not introduce heavy animation libraries (Framer Motion, GSAP).

        Internationalization:
        - User-visible text must exist in both `src/messages/en.json` and `src/messages/hi.json`.

    # Translation Catalogs
    - path: "src/messages/*.json"
      instructions: |
        - Ensure complete key parity between `en.json` and `hi.json`.
        - Values must be accurate and must not contain unescaped formatting tags that break next-intl rich text.

    # Test files
    - path: "tests/**/*.{ts,tsx}"
      instructions: |
        - Verify test coverage using Vitest and React Testing Library.
        - Ensure tests are non-trivial, non-tautological, and properly assert expected behavior.

    # Asset files
    - path: "public/brand/**/*"
      instructions: |
        - Image optimization (appropriate format and compression; WebP preferred for photos).
        - Brand identity compliance according to `public/brand/Brand.md`.
